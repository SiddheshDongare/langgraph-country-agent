[project]
name = "country-agent"
version = "0.1.0"
description = "AI agent for answering questions about countries using LangGraph"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=1.1.1",
    "langchain-core>=1.2.19",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "ruff>=0.8",
]

[project.scripts]
country-agent = "country_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
